name: Deploy Local Lift to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      # No lockfile-dependent cache: the workflow works without an existing lockfile.
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Build and inspect static output
        env:
          VITE_BASE_PATH: /BUSN9155_Codex/
          VITE_SITE_URL: https://kapohari2k.github.io/BUSN9155_Codex/
          VITE_FORMSPREE_ENDPOINT: ${{ vars.VITE_FORMSPREE_ENDPOINT }}
          VITE_GA4_MEASUREMENT_ID: ${{ vars.VITE_GA4_MEASUREMENT_ID }}
        run: |
          npm run build
          npm run check:dist
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
